[project]
name = "nomo"
version = "0.1.0"
description = "Self-contained local agent. Ollama for language, optional Needle 3 for tools, files for memory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
needle = ["cactus-needle==3.2.8"]

[project.scripts]
nomo = "nomo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nomo*"]
